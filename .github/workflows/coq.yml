            exit 1
          fi
          grep -q "Welcome to Chicken 9.3.0" ConstructiveWorld_Live/_chk_all.log \
            || { echo "GATE-BANNER-FAIL: coqchk 代际非 9.3（COQLIB/COQCHK 钉代失守或形A脚本未入树，log 不可作公理判据）"; exit 1; }
          python scripts/gates/gate2_axioms_parser.py \
            ConstructiveWorld_Live/_chk_all.log --json gate2_verdict.json

      - name: Upload coqchk logs
        if: always()
        uses: actions/upload-artifact@v7
