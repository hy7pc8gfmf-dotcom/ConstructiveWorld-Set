name: Coq CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos_only:
        description: "Run ONLY the macOS job (Mac-lane self-serve certification; Windows zero occupation)"
        required: false
        default: false
        type: boolean

concurrency:
  group: cw-main-ci-${{ github.ref }}  # per-ref pools: PR certification runs and main push runs queue separately (pending-run priority cancellation killed PR cert runs when sharing one pool)
  cancel-in-progress: false

jobs:
  coq-build:
    name: Rocq 9.3 build + coqchk (single Live tree, cold build)
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.macos_only != true) }}
    # 【20261026 标签收窄】裸 self-hosted 亦可匹配 Mac runner——Mac 接单后 Windows 壳
    # 路径（C:/Progra~1/Git/bin/bash.exe）在 macOS 不存在＝gate1 步级秒红
    # （run 40205628059 实证 25s 红）；set-runner offline 期认证 job 长期 queued
    # 无 runner 可接（run 40236969222 实证）。收窄后 Mac 只认观察档 job。
    runs-on: [self-hosted, Windows]
    # 20261104: Set had no wall (Main has 960) - run #176 ground 5h in a gate7
    # pipe deadlock with zero ceiling. 720min >= cold build + gate7 worst case.
    timeout-minutes: 720
    steps:
      # NETRED self-heal gate (20261106): github.com:443 flaps in multi-minute windows;
      # checkout dying at fetch costs the whole run. Wait (bounded) for a stable channel first.
      - name: Wait for git channel (NETRED self-heal gate)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          set +e
          ok=0
          for i in $(seq 1 40); do
            if git ls-remote https://github.com/hy7pc8gfmf-dotcom/ConstructiveWorld-Set.git refs/heads/main >/dev/null 2>&1; then ok=$((ok+1)); else ok=0; fi
            [ "$ok" -ge 2 ] && { echo "NETRED-GATE: channel stable (try $i)"; exit 0; }
            sleep 30
          done
          echo "NETRED-GATE-FAIL: git channel unstable for 20min - fail loud (rerun when the window opens)"
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ── AX-FORTRESS 防线挂点（20260925 施工单，R131 落树）────────────────────
      # 闸① 毒 token 守卫：pre-build fail-fast，秒级。exit 0 洁净／1 命中／2 树无效——
      # bash -e 下非零即 step 红且后续步不启（禁红后继续）。gate1 系扁平扫描（非递归）。
      # 【SINGLE-TREE 20261007 重排（#C-S00c）】Set 仓自 #C-S00 起 vo 树整体退役
      # （单 Live 树口径），gate1 只扫 ConstructiveWorld_Live——词表与扫描口径
      # 零改动，仅拓扑与参数路径随单树设计移动。
      - name: gate1 poison-token guard (pre-build fail-fast)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          python scripts/gates/gate1_poison_guard.py \
            --tree ConstructiveWorld_Live \
            --json gate1_ci.json --text

      # 闸④ 注释哨兵（comment hygiene hard-gate，R135 落树）：gate1 后顺位——
      # 注释面先于公理面红闸（GATE4-EXT 草案口径）。gate4_comment_guard.py v2.0：
      # 头注五字段＋基座 65 禁词＋扩展五族共 130 扫描单元＋三域全量（文件头注/
      # 证明体内/子结构头注）＋判定原则启发式（--no-principle 可作降噪开关，CI 默认开）。
      # exit 0=PASS 绿；1=硬违规红屏（五字段缺/词面硬命中/承认式/席次战役/日期戳——
      # bash -e 下同 gate1 教义，非零红且后续步不启，禁红后继续）；2=黄级（仅原则
      # 启发式复核项/语境双义词如「载体」）——artifact 收编不红屏，人工复核清单
      # 随 gate4_report.json 出。双树口径与 gate1 同款；升级方向：CW219_split
      # 消融波断根后回补第三 --tree。
      # 【CI-ARTIFACT-FIX 20260926 事实登记】report 先写后判：脚本在 exit 码裁决前
      # 无条件落 gate4_report.json（v2.0/v2.1 同序，红/黄/绿三态均留证）。
      # 【--tree-recursive 裁决 20260926】默认关（守 1227 口径连续性，R135 1281→
      # R134 1245→LATEST 1227 对照链不破）；v2.1 脚本随下一波认证合流入库后，
      # 候探针件族归册/清偿 commit 落树再原子开启（vo 树 +22 盲区面如实入红账，
      # 红只增不减，禁降档）。
      # 【SINGLE-TREE 20261007 重排（#C-S00c）】--tree 收窄为 ConstructiveWorld_Live
      # 单树（vo 树已退役），词表/扫描单元/启发式口径零改动。
      - name: gate4 comment guard (pre-build, exit1=red exit2=yellow artifact-only)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          set +e
          python scripts/gates/gate4_comment_guard.py \
            --tree ConstructiveWorld_Live \
            --json gate4_report.json
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "GATE4-RED: comment-guard hard violations — see gate4_report.json artifact"
            exit 1
          elif [ "$rc" -eq 2 ]; then
            echo "GATE4-YELLOW: review-only findings — artifact-collected, not red"
            exit 0
          elif [ "$rc" -eq 0 ]; then
            echo "GATE4-GREEN: all comment checks passed"
          else
            echo "GATE4-UNEXPECTED-EXIT rc=$rc — fail-loud, treat as red"
            exit 1
          fi


      # 闸⑥ 语句面/字段位 Prop 词面普查（gate6·红线律 v2.5 裁决八现役·20261026）。
      # 三通道预筛（ch1 语句面/ch2 字段位/ch3 全局假设）——语义最终仲裁=gate7 提取差分。
      # 基线=20261026 全树实测零命中（57 文件/5,373 语句名）；闸态=红在增量（R15 存量
      # 冻结不追溯·新文件零容忍 born-clean）。基线再生成须同 commit 显式申报逐条说明。
      - name: gate6 statement+field Prop census (pre-build, red-on-growth)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          python scripts/gates/gate6_statement_census.py \
            --tree ConstructiveWorld_Live \
            --gate --baseline scripts/gates/gate6_baseline.json \
            --json gate6_report.json

      # 【gate3 跨树 Require 毒面对称检查——步撤除 20261007（#C-S00c）】
      # 撤除理由：gate3 的不变量是 Live↔vo 跨树 Require 面对称（E957 暗雷族/世系倒
      # 灌守卫）。#C-S00 起本仓为单 Live 树设计，vo 树整体退役——跨树同步不变量
      # 的对象集为空集，该闸无检查对象，属「不变量不适用」而非「降级豁免」。
      # gate1（源面毒 token）与 gate5（vo 二进制依赖层检疫）两闸照常全量把守，
      # 扫描词表零弱化；若未来重建第二世系树，gate3 须随树回补。

      # Build：单 Live 树冷编（order.txt 拓扑，逐件真 RC，败出日志尾 30 行 fail-loud）。
      # 仓内自足 bash 脚本（scripts/ci_build_live_cached.sh·形A）：工具链自 env 取 COQC（unset
      # 默认=C:/Rocq-Platform~9.1~2026.01 字节等价），COQLIB/ROCQLIB 按 SW2 同根律自 COQC 推导；
      # 本 yml Build 步全字面 export COQC/COQLIB/ROCQLIB=9.3 opam root 即整链换代（20261102 换基）。
      # cwd=仓根，-Q ConstructiveWorld_Live ""。
      # 【seed 步撤除（#C-S00c）】无播种源可依（本仓 HEAD 在册 .vo=0，vo 树退役），
      # 15 件冷编分钟级可忍；旧「从本地 vo 树播种吃指纹 SKIP」路径随单树设计退役。


      # 20261026 信任缓存播种（镜像语义·Main 仓先例移植）：先清空 checkout 的 .vo 再从
      # 本地信任缓存树整拷——build 树=缓存真镜像，指纹 SKIP 生效且陈旧幸存根除（P9）。
      # fail-open：缓存缺席=全量冷编（57 件分钟级·正确性不依赖本步）。
      - name: Seed trust cache from local vo tree (mirror semantics, fail-open)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          # 20261030 run-67 lesson: mirror rm+cp guarantees checkout==mirror SET,
          # not mirror-generation; a stale-generation .vo for a relanded piece
          # shadowed the cured .v (KLWallClosed gate7 magic=2 on a cured file).
          # Build now skips only on vo-newer + digest sidecar match, so seed must
          # carry the sidecars too; absent sidecars => one honest cold build.
          rm -f ConstructiveWorld_Live/*.vo ConstructiveWorld_Live/*.vos ConstructiveWorld_Live/*.vok ConstructiveWorld_Live/*.vobuild.md5 2>/dev/null || true
          cp /d/ComplexAnalysis/ConstructiveWorld-Set/ConstructiveWorld_Live/*.vo ConstructiveWorld_Live/ 2>/dev/null || true
          cp /d/ComplexAnalysis/ConstructiveWorld-Set/ConstructiveWorld_Live/*.vobuild.md5 ConstructiveWorld_Live/ 2>/dev/null || true
          # 20261101 gate7 ghost lesson (UpReqAlign3 magic=370 after M52R withdrawal):
          # a withdrawn piece leaves its stale .vo in the mirror; purge any .vo
          # whose .v is absent so gate7 never sees ghosts.
          find ConstructiveWorld_Live -maxdepth 1 -name "*.vo" | while read -r f; do
            b="${f%.vo}"
            [ -f "$b.v" ] || { rm -f "$f" "$b.vobuild.md5" 2>/dev/null || true; echo "purged ghost $f"; }
          done
          # 【20261102 Rocq 9.3 换基·首炉禁播 9.1 .vo】.vo 魔数 9.1=43 6f 71 21 00 01 5f f4（0x15FF4）／
          # 9.3=…00 01 60 bc（0x160BC）。本地实测：开发树 258 .vo 全 9.1（含 45 ghost）·set93c 213 .vo 全 9.3 零侧车。
          # 9.1 .vo 播入 9.3 炉＝coqc Require 代际红／coqchk 不可判；指纹 SKIP 还会放行同名 9.1 陈旧件。
          # 守卫：播种后若测得任一非 9.3 魔数 .vo → 整体清播（.vo＋侧车）退回诚实冷编（fail-open 不红），
          # 并经 GITHUB_ENV 置 SEED_ERA_MISMATCH=1 令 Build 步本炉禁回写（封存律：9.3 产物禁写入 9.1 开发树）。
          # 期望态：R2 缓存换装（ci_switch/swap/swap_cache_93_set.sh）落后开发树=9.3 代，本守卫零触发；换装前每炉冷编 213。
          era_bad=0; era_unk=0
          for f in ConstructiveWorld_Live/*.vo; do
            [ -e "$f" ] || continue
            m="$(od -An -tx1 -N8 "$f" 2>/dev/null | tr -d ' \n')"
            if [ -z "$m" ]; then era_unk=$((era_unk+1)); elif [ "$m" != "436f7121000160bc" ]; then era_bad=$((era_bad+1)); fi
          done
          if [ "$era_bad" -gt 0 ]; then
            echo "SEED-ERA-GUARD: $era_bad seeded .vo are not Rocq 9.3 magic (0x160BC; 9.1=0x15FF4) — purging ALL seeded .vo+sidecars; honest cold build on 9.3 base; CACHE_WRITEBACK disabled this run"
            rm -f ConstructiveWorld_Live/*.vo ConstructiveWorld_Live/*.vobuild.md5 2>/dev/null || true
            { [ -n "${GITHUB_ENV:-}" ] && echo "SEED_ERA_MISMATCH=1" >> "$GITHUB_ENV"; } || echo "SEED-ERA-GUARD: WARN GITHUB_ENV unavailable — writeback flag not propagated (fail-open)"
          elif [ "$era_unk" -gt 0 ]; then
            echo "SEED-ERA-GUARD: WARN $era_unk .vo unreadable by od — magic unverified, seeding kept (fail-open)"
          fi
          echo "seeded $(ls ConstructiveWorld_Live/*.vo 2>/dev/null | wc -l) .vo $(ls ConstructiveWorld_Live/*.vobuild.md5 2>/dev/null | wc -l) sidecars (mirror-deleted stale)"

      - name: Build Live tree (order topology, cold, thermal-guarded)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          # 【20261030 栈墙处方同 mac 侧】BetaLower 深递归件双栈互证（8192 红/65532 绿）。
          ulimit -s 65532
          # 【20261026 温控正典三参数】20261023 用户令：-TempLimit 98 -AllowG3 -GearForce 0
          # 三参数缺一＝钳位饥饿复发（idle 读 94-97C 空转 80%）。serial build 保留 -CoreN 2。
          # 【20261026 guard 正典化】repo 根 cpu_guard.ps1 系旧 shim（无 TL98/G3 参数面），
          # 指向 infra 正典 v3（Main 仓同款·单源防分叉）。
          # 【20261026 信任缓存通道】build 换指纹跳过双生子 ci_build_live_cached.sh——
          # 播种（上一步镜像 rm+cp）后 .vo 新于 .v 即 SKIP，缺者真编；镜像语义防陈旧幸存（P9）。
          # 20261029 绿门回写：build 全绿且本地开发树无未提交改动（era 护栏）时，

          # 把检出树新编 .vo 回写本地信任缓存——Apple push 先触发 CI 的场合，

          # 新件编译一次即自动本地缓存化（否则仅入 artifact·本地缓存断链）。

          # 【20261102 换基·封存律联动】播种步若测得非 9.3 魔数播种源（SEED_ERA_MISMATCH=1 经 GITHUB_ENV 传递），
          # 本炉不回写——9.3 新编 .vo/侧车禁写入仍为 9.1 代的开发树（R2 缓存换装未落时的腐蚀防线）。
          if [ "${SEED_ERA_MISMATCH:-0}" = "1" ]; then
            echo "CACHE-WRITEBACK: disabled this run (seed source not 9.3 era; dev tree sealed — run R2 swap_cache_93_set.sh first)"
          else
            export CACHE_WRITEBACK_DIR=/d/ComplexAnalysis/ConstructiveWorld-Set/ConstructiveWorld_Live
          fi

          # 【20261102 Rocq 9.3 换基·形A 环境注入】脚本消费位=ci_build_live_cached.sh 顶部
          # COQC="${COQC:-…9.1…}"＋SW2 同根推导；此处三 export 全字面（SW2：禁依赖 runner 继承 env）。
          # env 经 bash→pwsh(cpu_guard_v3 L183 Start-Process cmd /c·无 -UseNewEnvironment)→bash 透传——
          # 上方 CACHE_WRITEBACK_DIR 同路先例已在产线验证。
          # 【R0 前置硬闸】origin 现版脚本 L8-10 无条件 export 9.1 会覆盖本注入⇒形A 版脚本须先于/同 commit
          # 入树（正本 attn/_setbuild_patch/ci_build_live_cached.sh）；未落则 gate2 banner 钉 9.3.0 红出（fail-loud）。
          export COQC="D:/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default/bin/coqc.exe"
          export COQLIB="D:/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default/lib/coq"
          export ROCQLIB="$COQLIB"
          pwsh -File D:/ComplexAnalysis/infra/thermal/cpu_guard_v3.ps1 -Command "bash scripts/ci_build_live_cached.sh" -LoadLimit 60 -CoolSec 5 -MaxWaitSec 7200 -CoreN 2 -TempLimit 98 -AllowG3 -GearForce 0

      # 闸⑦ 提取执行（gate7·红线律 v2.5 裁决八现役·律四 4a 自动化·泄露最终机械仲裁）。
      # 逐模块单命令 Separate Extraction 全量直提（单命令多名全提律）→ .ml/.mli 双面
      # Obj.magic 分账（=0 目标·增量=红=按 Prop 泄露级处置）＋语句名在卷差分（擦除候选
      # 报告·禁直判违规——三源判读律）。前置=build 全绿（驱动吃 .vo）。基线候首绿轮
      # 预注册；基线再生成须同 commit 显式申报。
      - name: gate7 extraction execution (post-build, red-on-growth)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          # Form-A injection (Rocq 9.3 wave 20261102, #133-attempt2 lesson):
          # gate7 drivers compile against the freshly built .vo tree — without
          # the injected 9.3 toolchain they pick machine-PATH 9.1 coqc and
          # cross-generation reject every module (rc=1 x283, magic=None).
          export COQC="D:/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default/bin/coqc.exe"
          export COQCHK="D:/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default/bin/coqchk.exe"
          export COQLIB="D:/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default/lib/coq"
          export ROCQLIB="$COQLIB"
          python scripts/gates/gate7_extract_run.py \
            --coqc "D:/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default/bin/coqc.exe" \
            --tree ConstructiveWorld_Live \
            --order ConstructiveWorld_Live/order.txt \
            --workdir _gate7_work \
            --gate --baseline scripts/gates/gate7_extract_baseline.json \
            --json gate7_report.json

      # S7/PA4+PB6：全树模块计数自动化——六维计数三口径分列（注册面/侧树顶层/沙箱）；
      # record-only，缺席口径不红屏（非硬闸，保持原样）。
      - name: Generate tree-stats (six-dimension counts, three-caliber breakdown)
        if: always()
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          pwsh -File scripts/gen_tree_stats.ps1 -CI -OutFile tree-stats.json
          echo "tree-stats head: $(head -c 300 tree-stats.json)"

      - name: Upload tree-stats
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tree-stats
          path: tree-stats.json

      # 闸⑤ .vo/.vos/.vok 二进制依赖层检疫（GATE-VOQ 20260926，E-STAGING-AXFORENSIC-1 判例）。
      # 【SINGLE-TREE 20261007 重排（#C-S00c）】扫描面改指本步 build 的 Live .vo 产物面；
      # 对照组 auto 定位（装机路径 SELF-HIT 校准）与词表/digest 黑名单口径零改动。
      # 【20261102 Rocq 9.3 换基·黑名单换件 v2→v3_93】源件=attn/rocq93_work_20261101/set93c/_attest93/
      # poison_digest_blacklist_v3_93.txt（28 枚=§A v2 原 25 枚 9.1 字节指纹逐字保留＋§B 9.3 重产 3 枚；
      # §C 18 槽候步2 Main 9.3 闭包后再产）→ 入树为 scripts/gates/poison_digest_blacklist_v3_93.txt，本步
      # 显式 --blacklist 指之（脚本默认仍=v2·脚本零改·v2 文件保留供回滚）。【入树时序硬闸】黑名单文件须
      # 先于/同 commit 入树：缺件=脚本 rc=2「黑名单不可用」→ 本步 GATE5-NOSCANNABLE 红。对照组：find_control
      # 钉 9.1 平台装机路径优先（平台封存在位⇒SELF-HIT 恒成立·方法自证与被扫树代际无关）；如需同代对照可加
      # --control D:/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default/lib/coq/user-contrib/Stdlib/Reals/ClassicalDedekindReals.vo
      # （9.3 侧在位实测·本波不加·登记备用）。首炉期望：硬 token 0＋digest 0＋对照 PASS（attest93 [C] 对 213 件 9.3 树实测 CLEAN）。
      - name: gate5 vo-binary quarantine (pre-coqchk, token+digest, control-calibrated)
        if: always()  # 上游红不阻断 gate5 出证（gate3 先例保留语义）
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          set +e
          python scripts/gates/gate5_vodep_quarantine.py \
            --tree ConstructiveWorld_Live \
            --blacklist scripts/gates/poison_digest_blacklist_v3_93.txt \
            --json gate5_vodep_report.json
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "GATE5-RED: poison token/digest hit in .vo/.vos/.vok binary layer — HIT list above; disposition per VO-RES-CLEAN (purge poison gen + rebuild consumer closure from clean source + Axioms=<none> recheck)"
            exit 1
          elif [ "$rc" -eq 2 ]; then
            echo "GATE5-NOSCANNABLE: no scannable surface / tree missing / control SELF-HIT failed — treat as red (fail-loud, gate2 GATE-BANNER-ABSENT precedent; upstream red cause first)"
            exit 1
          elif [ "$rc" -eq 0 ]; then
            echo "GATE5-GREEN: vo binary layer clean (hard token 0-hit + digest 0-hit + control SELF-HIT pass; Psatz soft counts in gate5_vodep_report.json)"
          else
            echo "GATE5-UNEXPECTED-EXIT rc=$rc — fail-loud, treat as red"
            exit 1
          fi

      # coqchk 认证：单 Live 树共享闭包单趟 -o（scripts/ci_coqchk_live.sh 自足实现，
      # 判据=EXIT=0 且 "Modules were successfully checked" → COQCHK_ALL_PASS，
      # 日志落 ConstructiveWorld_Live/_chk_all.log），温控包裹照旧。
      - name: coqchk full-tree certification (shared-closure single pass, thermal-guarded)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
