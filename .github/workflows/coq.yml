name: Coq CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cw-main-ci
  cancel-in-progress: true

jobs:
  coq-build:
    name: Rocq 9.1 build + coqchk (single Live tree, cold build)
    # 【20261026 标签收窄】裸 self-hosted 亦可匹配 Mac runner——Mac 接单后 Windows 壳
    # 路径（C:/Progra~1/Git/bin/bash.exe）在 macOS 不存在＝gate1 步级秒红
    # （run 40205628059 实证 25s 红）；set-runner offline 期认证 job 长期 queued
    # 无 runner 可接（run 40236969222 实证）。收窄后 Mac 只认观察档 job。
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ── AX-FORTRESS 防线挂点（20260925 施工单，R131 落树）────────────────────
      # 闸① 毒 token 守卫：pre-build fail-fast，秒级。exit 0 洁净／1 命中／2 树无效——
      # bash -e 下非零即 step 红且后续步不启（禁红后继续）。gate1 系扁平扫描（非递归）。
      # 【SINGLE-TREE 20261007 重排（#C-S00c）】Set 仓自 #C-S00 起 vo 树整体退役
      # （单 Live 树口径），gate1 只扫 ConstructiveWorld_Live——词表与扫描口径
      # 零改动，仅拓扑与参数路径随单树设计移动。
      - name: gate1 poison-token guard (pre-build fail-fast)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          python scripts/gates/gate1_poison_guard.py \
            --tree ConstructiveWorld_Live \
            --json gate1_ci.json --text

      # 闸④ 注释哨兵（comment hygiene hard-gate，R135 落树）：gate1 后顺位——
      # 注释面先于公理面红闸（GATE4-EXT 草案口径）。gate4_comment_guard.py v2.0：
      # 头注五字段＋基座 65 禁词＋扩展五族共 130 扫描单元＋三域全量（文件头注/
      # 证明体内/子结构头注）＋判定原则启发式（--no-principle 可作降噪开关，CI 默认开）。
      # exit 0=PASS 绿；1=硬违规红屏（五字段缺/词面硬命中/承认式/席次战役/日期戳——
      # bash -e 下同 gate1 教义，非零红且后续步不启，禁红后继续）；2=黄级（仅原则
      # 启发式复核项/语境双义词如「载体」）——artifact 收编不红屏，人工复核清单
      # 随 gate4_report.json 出。双树口径与 gate1 同款；升级方向：CW219_split
      # 消融波断根后回补第三 --tree。
      # 【CI-ARTIFACT-FIX 20260926 事实登记】report 先写后判：脚本在 exit 码裁决前
      # 无条件落 gate4_report.json（v2.0/v2.1 同序，红/黄/绿三态均留证）。
      # 【--tree-recursive 裁决 20260926】默认关（守 1227 口径连续性，R135 1281→
      # R134 1245→LATEST 1227 对照链不破）；v2.1 脚本随下一波认证合流入库后，
      # 候探针件族归册/清偿 commit 落树再原子开启（vo 树 +22 盲区面如实入红账，
      # 红只增不减，禁降档）。
      # 【SINGLE-TREE 20261007 重排（#C-S00c）】--tree 收窄为 ConstructiveWorld_Live
      # 单树（vo 树已退役），词表/扫描单元/启发式口径零改动。
      - name: gate4 comment guard (pre-build, exit1=red exit2=yellow artifact-only)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          set +e
          python scripts/gates/gate4_comment_guard.py \
            --tree ConstructiveWorld_Live \
            --json gate4_report.json
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "GATE4-RED: comment-guard hard violations — see gate4_report.json artifact"
            exit 1
          elif [ "$rc" -eq 2 ]; then
            echo "GATE4-YELLOW: review-only findings — artifact-collected, not red"
            exit 0
          elif [ "$rc" -eq 0 ]; then
            echo "GATE4-GREEN: all comment checks passed"
          else
            echo "GATE4-UNEXPECTED-EXIT rc=$rc — fail-loud, treat as red"
            exit 1
          fi


      # 闸⑥ 语句面/字段位 Prop 词面普查（gate6·红线律 v2.5 裁决八现役·20261026）。
      # 三通道预筛（ch1 语句面/ch2 字段位/ch3 全局假设）——语义最终仲裁=gate7 提取差分。
      # 基线=20261026 全树实测零命中（57 文件/5,373 语句名）；闸态=红在增量（R15 存量
      # 冻结不追溯·新文件零容忍 born-clean）。基线再生成须同 commit 显式申报逐条说明。
      - name: gate6 statement+field Prop census (pre-build, red-on-growth)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          python scripts/gates/gate6_statement_census.py \
            --tree ConstructiveWorld_Live \
            --gate --baseline scripts/gates/gate6_baseline.json \
            --json gate6_report.json

      # 【gate3 跨树 Require 毒面对称检查——步撤除 20261007（#C-S00c）】
      # 撤除理由：gate3 的不变量是 Live↔vo 跨树 Require 面对称（E957 暗雷族/世系倒
      # 灌守卫）。#C-S00 起本仓为单 Live 树设计，vo 树整体退役——跨树同步不变量
      # 的对象集为空集，该闸无检查对象，属「不变量不适用」而非「降级豁免」。
      # gate1（源面毒 token）与 gate5（vo 二进制依赖层检疫）两闸照常全量把守，
      # 扫描词表零弱化；若未来重建第二世系树，gate3 须随树回补。

      # Build：单 Live 树冷编（order.txt 拓扑，逐件真 RC，败出日志尾 30 行 fail-loud）。
      # 仓内自足 bash 脚本（scripts/ci_build_live.sh）：SW2 全字面双 export
      # COQLIB/ROCQLIB=9.1，cwd=仓根，-Q ConstructiveWorld_Live ""。
      # 【seed 步撤除（#C-S00c）】无播种源可依（本仓 HEAD 在册 .vo=0，vo 树退役），
      # 15 件冷编分钟级可忍；旧「从本地 vo 树播种吃指纹 SKIP」路径随单树设计退役。
      # 20261026 信任缓存播种（镜像语义·Main 仓先例移植）：先清空 checkout 的 .vo 再从
      # 本地信任缓存树整拷——build 树=缓存真镜像，指纹 SKIP 生效且陈旧幸存根除（P9）。
      # fail-open：缓存缺席=全量冷编（57 件分钟级·正确性不依赖本步）。
      - name: Seed trust cache from local vo tree (mirror semantics, fail-open)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          rm -f ConstructiveWorld_Live/*.vo ConstructiveWorld_Live/*.vos ConstructiveWorld_Live/*.vok 2>/dev/null || true
          cp /d/ComplexAnalysis/ConstructiveWorld-Set/ConstructiveWorld_Live/*.vo ConstructiveWorld_Live/ 2>/dev/null || true
          echo "seeded (mirror-deleted stale) $(ls ConstructiveWorld_Live/*.vo 2>/dev/null | wc -l) .vo"

      - name: Build Live tree (order topology, cold, thermal-guarded)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          # 【20261026 温控正典三参数】20261023 用户令：-TempLimit 98 -AllowG3 -GearForce 0
          # 三参数缺一＝钳位饥饿复发（idle 读 94-97C 空转 80%）。serial build 保留 -CoreN 2。
          # 【20261026 guard 正典化】repo 根 cpu_guard.ps1 系旧 shim（无 TL98/G3 参数面），
          # 指向 infra 正典 v3（Main 仓同款·单源防分叉）。
          # 【20261026 信任缓存通道】build 换指纹跳过双生子 ci_build_live_cached.sh——
          # 播种（上一步镜像 rm+cp）后 .vo 新于 .v 即 SKIP，缺者真编；镜像语义防陈旧幸存（P9）。
          pwsh -File D:/ComplexAnalysis/infra/thermal/cpu_guard_v3.ps1 -Command "bash scripts/ci_build_live_cached.sh" -LoadLimit 60 -CoolSec 5 -MaxWaitSec 7200 -CoreN 2 -TempLimit 98 -AllowG3 -GearForce 0

      # 闸⑦ 提取执行（gate7·红线律 v2.5 裁决八现役·律四 4a 自动化·泄露最终机械仲裁）。
      # 逐模块单命令 Separate Extraction 全量直提（单命令多名全提律）→ .ml/.mli 双面
      # Obj.magic 分账（=0 目标·增量=红=按 Prop 泄露级处置）＋语句名在卷差分（擦除候选
      # 报告·禁直判违规——三源判读律）。前置=build 全绿（驱动吃 .vo）。基线候首绿轮
      # 预注册；基线再生成须同 commit 显式申报。
      - name: gate7 extraction execution (post-build, red-on-growth)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          python scripts/gates/gate7_extract_run.py \
            --tree ConstructiveWorld_Live \
            --order ConstructiveWorld_Live/order.txt \
            --workdir _gate7_work \
            --gate --baseline scripts/gates/gate7_extract_baseline.json \
            --json gate7_report.json

      # S7/PA4+PB6：全树模块计数自动化——六维计数三口径分列（注册面/侧树顶层/沙箱）；
      # record-only，缺席口径不红屏（非硬闸，保持原样）。
      - name: Generate tree-stats (six-dimension counts, three-caliber breakdown)
        if: always()
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          pwsh -File scripts/gen_tree_stats.ps1 -CI -OutFile tree-stats.json
          echo "tree-stats head: $(head -c 300 tree-stats.json)"

      - name: Upload tree-stats
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tree-stats
          path: tree-stats.json

      # 闸⑤ .vo/.vos/.vok 二进制依赖层检疫（GATE-VOQ 20260926，E-STAGING-AXFORENSIC-1 判例）。
      # 【SINGLE-TREE 20261007 重排（#C-S00c）】扫描面改指本步 build 的 Live .vo 产物面；
      # 对照组 auto 定位（装机路径 SELF-HIT 校准）与词表/digest 黑名单口径零改动。
      - name: gate5 vo-binary quarantine (pre-coqchk, token+digest, control-calibrated)
        if: always()  # 上游红不阻断 gate5 出证（gate3 先例保留语义）
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          set +e
          python scripts/gates/gate5_vodep_quarantine.py \
            --tree ConstructiveWorld_Live \
            --json gate5_vodep_report.json
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "GATE5-RED: poison token/digest hit in .vo/.vos/.vok binary layer — HIT list above; disposition per VO-RES-CLEAN (purge poison gen + rebuild consumer closure from clean source + Axioms=<none> recheck)"
            exit 1
          elif [ "$rc" -eq 2 ]; then
            echo "GATE5-NOSCANNABLE: no scannable surface / tree missing / control SELF-HIT failed — treat as red (fail-loud, gate2 GATE-BANNER-ABSENT precedent; upstream red cause first)"
            exit 1
          elif [ "$rc" -eq 0 ]; then
            echo "GATE5-GREEN: vo binary layer clean (hard token 0-hit + digest 0-hit + control SELF-HIT pass; Psatz soft counts in gate5_vodep_report.json)"
          else
            echo "GATE5-UNEXPECTED-EXIT rc=$rc — fail-loud, treat as red"
            exit 1
          fi

      # coqchk 认证：单 Live 树共享闭包单趟 -o（scripts/ci_coqchk_live.sh 自足实现，
      # 判据=EXIT=0 且 "Modules were successfully checked" → COQCHK_ALL_PASS，
      # 日志落 ConstructiveWorld_Live/_chk_all.log），温控包裹照旧。
      - name: coqchk full-tree certification (shared-closure single pass, thermal-guarded)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          # 【20261026 温控正典三参数】同 Build 步——20261023 用户令三参数缺一即钳位饥饿。
          pwsh -File D:/ComplexAnalysis/infra/thermal/cpu_guard_v3.ps1 -Command "bash scripts/ci_coqchk_live.sh" -LoadLimit 60 -CoolSec 5 -MaxWaitSec 7200 -CoreN 2 -TempLimit 98 -AllowG3 -GearForce 0

      # 20261026 跨机信任缓存通道（Windows 侧产物发布·绿后上传）：对侧（macOS）未来
      # 可经 vo_sync_once.sh 消费 vo-trust-cache-set-windows 实现一侧新增推送、对侧自动
      # 本地化+认证闭环（Main 仓 run#240 已验证模式）。观察档 job 本波不动（不破坏律）。
      - name: Upload vo trust cache (cross-machine sync)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: vo-trust-cache-set-windows
          path: |
            ConstructiveWorld_Live/*.vo

      # 闸② Axioms 段哨兵：块状态机解析（禁裸 grep——裸 -i error 假配 84 行／-i axiom
      # 假配 2213 行，E422/AX-MATRIX 实证；状态机段外假匹配结构性不可能）。
      # 前置硬要求：coqchk 已带 -o（无 Axioms 段=exit 2 不可判，一律红）。
      # exit 0 CLEAN／1 DIRTY／2 NO_AXIOMS_SECTION／3 LOG_INCOMPLETE——1/2/3 一律红（fail-loud）。
      # 代际钉：banner 必须 Chicken 9.1.0（COQLIB 钉代防假红，SW2）。
      # log 缺失≠代际失守：上游夭折时 coqchk 被 skipped、无日志可查——
      # 分支报 GATE-BANNER-ABSENT 指向上游红因（连带红不指控下游域），仍 exit 1 保持红。
      # 【SINGLE-TREE 20261007 重排（#C-S00c）】解析路径改指 ConstructiveWorld_Live/_chk_all.log。
      - name: gate2 axioms sentinel (block-state-machine, fail-loud)
        if: always()
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          if [ ! -f ConstructiveWorld_Live/_chk_all.log ]; then
            echo "GATE-BANNER-ABSENT: ConstructiveWorld_Live/_chk_all.log 不在盘——coqchk 未产出日志（上游 gate4/build 夭折连带，红因看上游步），非 COQLIB 代际失守"
            exit 1
          fi
          grep -q "Welcome to Chicken 9.1.0" ConstructiveWorld_Live/_chk_all.log \
            || { echo "GATE-BANNER-FAIL: coqchk 代际非 9.1（COQLIB 钉代失守，log 不可作公理判据）"; exit 1; }
          python scripts/gates/gate2_axioms_parser.py \
            ConstructiveWorld_Live/_chk_all.log --json gate2_verdict.json

      - name: Upload coqchk logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coqchk-logs
          # gate4_report.json 随本件搭车出证，无独立 gate4 artifact 名——
          # 按 artifact 名清点会误判「gate4 件缺席」（CI-ARTIFACT-FIX 20260926 三包实勘在案）。
          # gate3_ci.json 随 gate3 步撤除同步移出清单（#C-S00c）。
          path: |
            ConstructiveWorld_Live/_chk_*.log
            ConstructiveWorld_Live/_*.build.log
            gate1_ci.json
            gate2_verdict.json
            gate4_report.json
            gate5_vodep_report.json
            gate6_report.json
            gate7_report.json

      - name: Merged single-file build (retired with CW220 megafile; kept disabled for history)
        if: false
        continue-on-error: true
        run: |
          eval "$(opam env)"
          cd releases
          coqc -async-proofs off -Q . "" CW_ConstructiveWorld_220.v


  # ── macOS 观察档 job（#C-S00d 新增）─────────────────────────────────────
  # 母版=Main 仓 coq.yml coq-build-macos（run#240 已验证模式：continue-on-error
  # 观察档＋runs-on [self-hosted, macOS]＋bash -e {0}）。Set 单树适配：只
  # ConstructiveWorld_Live、无 vo 树（seed/导出步随之撤除）、构建与 coqchk 内联
  # Mac 形循环——scripts/ci_build_live.sh 与 ci_coqchk_live.sh 为 Windows 工具链
  # 硬编码（C:/Rocq-Platform~9.1~2026.01），Mac 侧不可调用；内联循环逐件镜像其
  # 语义（order.txt 拓扑／真 RC 逐件回显／败出日志尾 30 行；coqchk 共享闭包单趟
  # -o·下划线守卫）。温控=本机 cpu_guard.sh（pmst 温控门+队列梯度）替代 Windows
  # 侧 pwsh cpu_guard.ps1。工具链=本机 mac_rocq 9.1（SW2 全字面双 export 在步内）。
  # Windows 认证 job（上方）字节零动；本 job 红/绿不影响 run 结论（观察档）。
  coq-build-macos:
    name: Rocq 9.1 build + coqchk (single Live tree, macOS observation)
    runs-on: [self-hosted, macOS]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: gate1 poison-token guard (pre-build fail-fast)
        shell: bash -e {0}
        run: |
          python3 scripts/gates/gate1_poison_guard.py \
            --tree ConstructiveWorld_Live \
            --json gate1_ci.json --text

      - name: gate4 comment guard (pre-build, exit1=red exit2=yellow artifact-only)
        shell: bash -e {0}
        run: |
          set +e
          python3 scripts/gates/gate4_comment_guard.py \
            --tree ConstructiveWorld_Live \
            --json gate4_report.json
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "GATE4-RED: comment-guard hard violations — see gate4_report.json artifact"
            exit 1
          elif [ "$rc" -eq 2 ]; then
            echo "GATE4-YELLOW: review-only findings — artifact-collected, not red"
            exit 0
          elif [ "$rc" -eq 0 ]; then
            echo "GATE4-GREEN: all comment checks passed"
          else
            echo "GATE4-UNEXPECTED-EXIT rc=$rc — fail-loud, treat as red"
            exit 1
          fi

      - name: Build Live tree (order topology, cold, thermal-guarded, macOS)
        shell: bash -e {0}
        run: |
          export COQLIB="/Users/apple/actions-runner/mac_rocq/lib/coq"
          export ROCQLIB="/Users/apple/actions-runner/mac_rocq/lib/coq"
          COQC="/Users/apple/actions-runner/mac_rocq/bin/coqc"
          cd "$GITHUB_WORKSPACE" || exit 1
          # Mirror-clean products so a rerun never sees a stale .vo (same
          # semantics as scripts/ci_build_live.sh on the Windows side).
          rm -f ConstructiveWorld_Live/*.vo ConstructiveWorld_Live/_chk_all.log
          fail=0
          set +e
          while IFS= read -r line || [ -n "$line" ]; do
            f="${line%%\#*}"          # strip trailing #R-anchor
            f="${f%$'\r'}"            # CRLF-safe
            [ -z "$f" ] && continue
            if [ ! -f "ConstructiveWorld_Live/$f" ]; then
              echo "BUILD-FAIL: order entry $f missing from ConstructiveWorld_Live"
              fail=1
              continue
            fi
            log="ConstructiveWorld_Live/_${f%.v}.build.log"
            bash /Users/apple/Desktop/ConstructiveWorld/cpu_guard.sh -MaxWaitSec 1800 -- \
              "$COQC" -native-compiler no -q -Q "ConstructiveWorld_Live" "" "ConstructiveWorld_Live/$f" > "$log" 2>&1
            rc=$?
            echo "$f EXIT=$rc"
            if [ "$rc" -ne 0 ]; then
              fail=1
              echo "----- last 30 lines of $log -----"
              tail -30 "$log"
            fi
          done < ConstructiveWorld_Live/order.txt
          set -e
          if [ "$fail" -ne 0 ]; then
            echo "BUILD-FAIL: one or more files failed (true RC accounted above)"
          fi
          exit "$fail"

      - name: gate5 vo-binary quarantine (pre-coqchk, token+digest, control-calibrated)
        if: always()
        shell: bash -e {0}
        run: |
          # SW2 全字面双 export：gate5 对照组定位须 COQLIB/ROCQLIB 指 9.1 安装库
          # （mac launchd 双 unset，CONTROL_BASES 缺路；环境供给非动闸逻辑）。
          export COQLIB="/Users/apple/actions-runner/mac_rocq/lib/coq"
          export ROCQLIB="/Users/apple/actions-runner/mac_rocq/lib/coq"
          set +e
          python3 scripts/gates/gate5_vodep_quarantine.py \
            --tree ConstructiveWorld_Live \
            --json gate5_vodep_report.json
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "GATE5-RED: poison token/digest hit in .vo/.vos/.vok binary layer — HIT list above; disposition per VO-RES-CLEAN (purge poison gen + rebuild consumer closure from clean source + Axioms=<none> recheck)"
            exit 1
          elif [ "$rc" -eq 2 ]; then
            echo "GATE5-NOSCANNABLE: no scannable surface / tree missing / control SELF-HIT failed — treat as red (fail-loud, gate2 GATE-BANNER-ABSENT precedent; upstream red cause first)"
            exit 1
          elif [ "$rc" -eq 0 ]; then
            echo "GATE5-GREEN: vo binary layer clean (hard token 0-hit + digest 0-hit + control SELF-HIT pass; Psatz soft counts in gate5_vodep_report.json)"
          else
            echo "GATE5-UNEXPECTED-EXIT rc=$rc — fail-loud, treat as red"
            exit 1
          fi

      - name: coqchk full-tree certification (shared-closure single pass, thermal-guarded, macOS)
        shell: bash -e {0}
        run: |
          export COQLIB="/Users/apple/actions-runner/mac_rocq/lib/coq"
          export ROCQLIB="/Users/apple/actions-runner/mac_rocq/lib/coq"
          COQCHK="/Users/apple/actions-runner/mac_rocq/bin/coqchk"
          cd "$GITHUB_WORKSPACE" || exit 1
          log="ConstructiveWorld_Live/_chk_all.log"
          mods=()
          for vo in ConstructiveWorld_Live/*.vo; do
            if [ -e "$vo" ]; then
              b="$(basename "$vo" .vo)"
              case "$b" in
                _*) continue ;;
              esac
              mods+=("$b")
            fi
          done
          if [ ! -e "ConstructiveWorld_Live" ] || [ "${#mods[@]}" -eq 0 ]; then
            echo "COQCHK-FAIL: no certifiable modules in ConstructiveWorld_Live (build step missing?)"
            exit 1
          fi
          echo "coqchk modules (${#mods[@]}): ${mods[*]}"
          set +e
          bash /Users/apple/Desktop/ConstructiveWorld/cpu_guard.sh -MaxWaitSec 7200 -- \
            "$COQCHK" -o -Q "ConstructiveWorld_Live" "" "${mods[@]}" > "$log" 2>&1
          rc=$?
          set -e
          echo "COQCHK_EXIT=$rc"
          if [ "$rc" -eq 0 ] && grep -q "Modules were successfully checked" "$log"; then
            echo "COQCHK_ALL_PASS"
            exit 0
          fi
          echo "COQCHK_ALL_FAIL: see $log"
          tail -30 "$log"
          exit 1

      - name: gate2 axioms sentinel (block-state-machine, fail-loud)
        if: always()
        shell: bash -e {0}
        run: |
          if [ ! -f ConstructiveWorld_Live/_chk_all.log ]; then
            echo "GATE-BANNER-ABSENT: ConstructiveWorld_Live/_chk_all.log 不在盘——coqchk 未产出日志（上游 gate4/build 夭折连带，红因看上游步），非 COQLIB 代际失守"
            exit 1
          fi
          grep -q "Welcome to Chicken 9.1.0" ConstructiveWorld_Live/_chk_all.log \
            || { echo "GATE-BANNER-FAIL: coqchk 代际非 9.1（COQLIB 钉代失守，log 不可作公理判据）"; exit 1; }
          python3 scripts/gates/gate2_axioms_parser.py \
            ConstructiveWorld_Live/_chk_all.log --json gate2_verdict.json

      - name: Upload coqchk logs (macOS)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coqchk-logs-macos
          path: |
            ConstructiveWorld_Live/_chk_all.log
            ConstructiveWorld_Live/_*.build.log
            gate1_ci.json
            gate2_verdict.json
            gate4_report.json
            gate5_vodep_report.json
