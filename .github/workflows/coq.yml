  # ── macOS 观察档 job（#C-S00d 新增）─────────────────────────────────────
  # 母版=Main 仓 coq.yml coq-build-macos（run#240 已验证模式：continue-on-error
  # 观察档＋runs-on [self-hosted, macOS]＋bash -e {0}）。Set 单树适配：只
  # ConstructiveWorld_Live、无 vo 树（seed/导出步随之撤除）、构建与 coqchk 内联
  # Mac 形循环——scripts/ci_build_live_cached.sh 与 ci_coqchk_live.sh 自 20261102 换基起为形A
  # （COQC/COQCHK env 可覆写·unset 默认仍=C:/Rocq-Platform~9.1~2026.01 字节等价；Windows job 注入
  # D:/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default＝Rocq 9.3.0），路径形仍系 Windows，
  # Mac 侧不可调用；内联循环逐件镜像其
  # 语义（order.txt 拓扑／真 RC 逐件回显／败出日志尾 30 行；coqchk 共享闭包单趟
  # -o·下划线守卫）。温控=本机 cpu_guard.sh（pmst 温控门+队列梯度）替代 Windows
  # 侧 pwsh cpu_guard.ps1。工具链=本机 mac_rocq 9.1（SW2 全字面双 export 在步内）。
  # Windows 认证 job（上方）自 20261102 换基 commit 起为 Rocq 9.3；本 job 红/绿不影响 run 结论（观察档）。
  # 【20261102 Rocq 9.3 换基·Mac 侧两案并陈】本 job 工具链 mac_rocq 仍=9.1（Mac 工具包 v1.1·9.3 版未下发），
  # 与 Windows 9.3 两代不可同炉：
  #   案A（Mac 装好 9.3 后）：解除下方 job 级 if 闸；job 级 env MAC_ROCQ93_ROOT 指 9.3 实装根；步内
  #        COQLIB/ROCQLIB/COQC/COQCHK 改经 ${MAC_ROCQ93_ROOT} 取（叠加补丁 set_coq_yml_switch93_macA_overlay.diff）；
  #        banner 钉已随本 commit 预置 9.3.0（下方 gate2），解闸即生效。
  #   案B（本 commit 采用·过渡期）：job 级 if 恒假暂闸——理由①mac_rocq 9.1 对已切 9.3 的认证基线无对照意义，
  #        且 banner 钉 9.3.0 下必红（虽 continue-on-error 不染 run）；②本 job 绿后上传 vo-trust-cache-set-macos
  #        ＝9.1 代 .vo，过渡期禁产出以绝跨代合流面（vo_sync_watch 仍向 9.1 开发树合流·ci_switch/README 换基序 §6.4）。
  #        登记：暂闸起点=本 commit；解闸条件=Mac 工具包 v1.1 实装且 `<root>/bin/coqchk -v`=9.3.0；
  #        解闸动作=套 macA overlay（含填 MAC_ROCQ93_ROOT 实路径）。
  coq-build-macos:
    name: Rocq 9.3 build + coqchk (single Live tree, macOS observation)
    # 案A 解闸（20261103·Mac 9.3 实装验收过：rocq/coqc/coqchk -v=9.3.0，root 如下 env；解闸条件「Mac 工具包实装且 coqchk=9.3.0」已满足）
    runs-on: [self-hosted, macOS]
    env:
      MAC_ROCQ93_ROOT: /Users/apple/Desktop/mac93_install_work/opam93/rocq93
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: gate1 poison-token guard (pre-build fail-fast)
        shell: bash -e {0}
        run: |
          python3 scripts/gates/gate1_poison_guard.py \
            --tree ConstructiveWorld_Live \
            --json gate1_ci.json --text

      - name: gate4 comment guard (pre-build, exit1=red exit2=yellow artifact-only)
        shell: bash -e {0}
        run: |
          set +e
          python3 scripts/gates/gate4_comment_guard.py \
            --tree ConstructiveWorld_Live \
            --json gate4_report.json
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "GATE4-RED: comment-guard hard violations — see gate4_report.json artifact"
            exit 1
          elif [ "$rc" -eq 2 ]; then
            echo "GATE4-YELLOW: review-only findings — artifact-collected, not red"
            exit 0
          elif [ "$rc" -eq 0 ]; then
            echo "GATE4-GREEN: all comment checks passed"
          else
            echo "GATE4-UNEXPECTED-EXIT rc=$rc — fail-loud, treat as red"
            exit 1
          fi

      # 20261028 两向总线·macOS 半环（本侧缓存通道三步之一；首跑空缓存=冷编自举
      # +绿后导出，次轮起吃指纹 SKIP——Main 仓 run#240 已验证模式移植）。
      # 【20261103 W3 模式实装】指纹 SKIP＋信任缓存播种（用户令三捷径）：种子器
      # scripts/ci_seed_mac93.sh 从本机 9.3 缓存源逐件播种（era 守卫 od 魔数
      # 0x160BC=90300 ＋ 源侧 .v-md5 对账防跨代〔run#51 判例〕＋manifest 源自
      # 绿门 Export 步），sidecar 双 token "<.v md5> <closure digest>" 与
      # scripts/ci_build_live_cached.sh 逐字同算法；fail-open=种子器故障清播
      # 退诚实冷编。source md5 对不上=不播=真编（E949 字节层失效语义）。
      - name: Seed mac-native 9.3 trust cache (era-guarded, md5-reconciled, fail-open)
        shell: bash -e {0}
        run: |
          export COQDEP="${MAC_ROCQ93_ROOT}/bin/coqdep"
          bash scripts/ci_seed_mac93.sh

      - name: Build Live tree (fingerprint SKIP, thermal-guarded, macOS)
        shell: bash -e {0}
        run: |
          # 【20261030 栈墙处方】BetaLower L278 深递归默认栈 8192 必 Stack overflow
          # （run 40973373689 attempt1 实证·同件同世界 ulimit 65532 RC=0 本地双炮互证）；
          # 与 mac coqchk 步内建 ulimit 65532 同源（RC129 判例）。
          ulimit -s 65532
          # 【20261103 W3 形 A 环境注入】COQC/COQLIB/ROCQLIB 全字面（SW2 禁依赖
          # runner 继承 env）；COQDEP 显式——canonical 脚本的 .exe 推导路径在
          # mac 非 .exe 形下会推错（scriptSpec 勘定）。md5sum shim 前置（macOS
          # 无 md5sum，/sbin/md5 -r 后端；种子器同款，digest 等价）。
          export COQC="${MAC_ROCQ93_ROOT}/bin/coqc"
          export COQDEP="${MAC_ROCQ93_ROOT}/bin/coqdep"
          export COQLIB="${MAC_ROCQ93_ROOT}/lib/coq"
          export ROCQLIB="${MAC_ROCQ93_ROOT}/lib/coq"
          export CW_MD5SHIM_DIR=/tmp/cw_md5shim
          if [ ! -x "$CW_MD5SHIM_DIR/md5sum" ]; then
            mkdir -p "$CW_MD5SHIM_DIR"
            printf '#!/bin/sh\nexec /sbin/md5 -r "$@"\n' > "$CW_MD5SHIM_DIR/md5sum"
            chmod +x "$CW_MD5SHIM_DIR/md5sum"
          fi
          export PATH="$CW_MD5SHIM_DIR:$PATH"
          cd "$GITHUB_WORKSPACE" || exit 1
          # 种子步已 mirror-clean＋对账播种（rm 仅余 _chk_all.log 旧日志面）。
          rm -f ConstructiveWorld_Live/_chk_all.log
          # 【构建循环择路】canonical scripts/ci_build_live_cached.sh 用关联数组
          # （declare -A·bash>=4）；macOS 系统 bash=3.2（本机实测 declare -A 报
          # invalid option，runner PATH 亦无 bash4）——bash>=4 在位时走 canonical
          # 正典脚本，3.2 退 ci_seed_mac93.sh --build-only（其 bash3 兼容移植版·锚行
          # 同款 CACHE-BUILD-SUMMARY／DEP-PRECHECK／sidecar 双 token 同算法；
          # --build-only=纯构建不重播——种子属上一步职责，双播=双份 coqdep+cp 纯浪费）。
          # 温控包裹（任务书铁律参数）：cpu_guard -Reg 分道 -Front 0 -Mid 1
          # -MaxWaitSec 600；一切 coqc 编译在 guard 子树内。
          if bash -c 'declare -A x=()' 2>/dev/null; then
            echo "BUILD-LOOP: canonical scripts/ci_build_live_cached.sh (bash >= 4 detected)"
            bash /Users/apple/Desktop/ConstructiveWorld/cpu_guard.sh -Reg /tmp/cw_reg_w61w3 -Front 0 -Mid 1 -MaxWaitSec 600 -- \
              bash scripts/ci_build_live_cached.sh
          else
            echo "BUILD-LOOP: bash 3.2 (no associative arrays) -- ci_seed_mac93.sh --build-only (mac-equivalent port, identical anchors)"
            bash /Users/apple/Desktop/ConstructiveWorld/cpu_guard.sh -Reg /tmp/cw_reg_w61w3 -Front 0 -Mid 1 -MaxWaitSec 600 -- \
              bash scripts/ci_seed_mac93.sh --build-only
          fi

      - name: gate5 vo-binary quarantine (pre-coqchk, token+digest, control-calibrated)
        if: always()
        shell: bash -e {0}
        run: |
          # SW2 全字面双 export：gate5 对照组定位须 COQLIB/ROCQLIB 指 9.1 安装库
          # （mac launchd 双 unset，CONTROL_BASES 缺路；环境供给非动闸逻辑）。
          export COQLIB="${MAC_ROCQ93_ROOT}/lib/coq"
          export ROCQLIB="${MAC_ROCQ93_ROOT}/lib/coq"
          set +e
          # 【20261102 换基】黑名单同 Windows 侧换 v3_93（入树时序硬闸同上）；案B 暂闸期本步不跑。
          python3 scripts/gates/gate5_vodep_quarantine.py \
            --tree ConstructiveWorld_Live \
            --blacklist scripts/gates/poison_digest_blacklist_v3_93.txt \
            --json gate5_vodep_report.json
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "GATE5-RED: poison token/digest hit in .vo/.vos/.vok binary layer — HIT list above; disposition per VO-RES-CLEAN (purge poison gen + rebuild consumer closure from clean source + Axioms=<none> recheck)"
            exit 1
          elif [ "$rc" -eq 2 ]; then
            echo "GATE5-NOSCANNABLE: no scannable surface / tree missing / control SELF-HIT failed — treat as red (fail-loud, gate2 GATE-BANNER-ABSENT precedent; upstream red cause first)"
            exit 1
          elif [ "$rc" -eq 0 ]; then
            echo "GATE5-GREEN: vo binary layer clean (hard token 0-hit + digest 0-hit + control SELF-HIT pass; Psatz soft counts in gate5_vodep_report.json)"
          else
            echo "GATE5-UNEXPECTED-EXIT rc=$rc — fail-loud, treat as red"
            exit 1
          fi

      # ── W3 content-addressed attestation 接线（v1 report-only·20261030 工单）────
      # coqchk 步前对新鲜 build 的 .vo 树做内容寻址对账：逐件 sha256 对认证档案
      # 三态分账（unchanged/changed/removed·added 信息列）＋tree_sha256 顶层聚合。
      # 【入仓清单·两件脚本＋首档注记】本步依赖 scripts 两件入仓（seat_w3set 沙箱
      # 同源·纯 python 零编译·对账逻辑零重复的成对件）：
      #   scripts/coqchk_attest.py      — build 建档 / check 三态对账（0=CLEAN 1=DIRTY 2=操作错）
      #   scripts/coqchk_delta_check.py — check 薄包装·人读差分摘要渲染（import 同一实现）
      # 首档注记：scripts/coqchk_attestation.json 系 coqchk_attest.py build 的产物
      # （逐 .vo sha256＋tree_sha256 聚合），首档与后续刷新一律由绿 run 的 .vo 树
      # 生成后入库，禁手改；档案缺席（首跑/合流早期）=check rc=2「认证档案不存在」
      # ——report-only 语义下 rc 恒被捕获、本步恒 exit 0，绝不红屏。
      # v2 跳验候（对账 CLEAN 时可否 SKIP coqchk）另行立项，本 v1 不承载闸语义。
      - name: content-addressed attestation (v1 report-only)
        shell: bash -e {0}
        run: |
          set +e
          python3 scripts/coqchk_attest.py check \
            --tree ConstructiveWorld_Live \
            --archive scripts/coqchk_attestation.json \
            --json gate_attest_report.json
          rc=$?
          # 差分摘要 echo：人读三态逐件点名（薄包装与 check 同一实现·双跑毫秒级）
          python3 scripts/coqchk_delta_check.py \
            --tree ConstructiveWorld_Live \
            --archive scripts/coqchk_attestation.json
          rc2=$?
          set -e
          echo "ATTEST-REPORT-ONLY: coqchk_attest rc=$rc / coqchk_delta_check rc=$rc2 — v1 report-only, never gates this run (v2 skip-validation 立项另议)"
          exit 0

      - name: Upload coqchk attestation report (v1, report-only)
        uses: actions/upload-artifact@v7
        with:
          name: coqchk-attest-report-macos
          path: gate_attest_report.json

      - name: coqchk full-tree certification (shared-closure single pass, thermal-guarded, macOS)
        shell: bash -e {0}
        run: |
          # 【20261030 coqchk 栈墙处方】102 件单遍 intern BetaLower.vo 溢出（run 40988043161
          # 实证）——默认栈 8192 必红；runner 树同件同栈双炮互证 65532 RC=0（全 102 过·
          # macOS 硬帽恰 65532）。与 Build 步同源（RC129 判例）。
          ulimit -s 65532
          export COQLIB="${MAC_ROCQ93_ROOT}/lib/coq"
          export ROCQLIB="${MAC_ROCQ93_ROOT}/lib/coq"
          COQCHK="${MAC_ROCQ93_ROOT}/bin/coqchk"
          cd "$GITHUB_WORKSPACE" || exit 1
          log="ConstructiveWorld_Live/_chk_all.log"
          mods=()
          for vo in ConstructiveWorld_Live/*.vo; do
            if [ -e "$vo" ]; then
              b="$(basename "$vo" .vo)"
              case "$b" in
                _*) continue ;;
              esac
              mods+=("$b")
            fi
          done
          if [ ! -e "ConstructiveWorld_Live" ] || [ "${#mods[@]}" -eq 0 ]; then
            echo "COQCHK-FAIL: no certifiable modules in ConstructiveWorld_Live (build step missing?)"
            exit 1
          fi
          echo "coqchk modules (${#mods[@]}): ${mods[*]}"
          set +e
          bash /Users/apple/Desktop/ConstructiveWorld/cpu_guard.sh -MaxWaitSec 7200 -- \
            "${COQCHK_EXTRA_FLAGS:--bytecode-compiler yes}" -o -Q "ConstructiveWorld_Live" "" "${mods[@]}" > "$log" 2>&1
          rc=$?
          set -e
          echo "COQCHK_EXIT=$rc"
          if [ "$rc" -eq 0 ] && grep -q "Modules were successfully checked" "$log"; then
            echo "COQCHK_ALL_PASS"
            exit 0
          fi
          echo "COQCHK_ALL_FAIL: see $log"
          tail -30 "$log"
          exit 1

      # 20261028 缓存导出（镜像·自举未来 SKIP）＋两向总线上行半环：构建绿后导出
      # 本机信任缓存供次轮播种，并上传 vo-trust-cache-set-macos 供 Windows 侧 sync 消费。
      # 【20261103 W3 播种闭环】导出同时生成 _manifest.tsv 溯源档（file<TAB>v_md5<TAB>vo_md5；
      # 本步跑在绿炉 checkout 树上——树净即 HEAD 代，v_md5=HEAD 代 .v 字节 md5），
      # 种子器 ci_seed_mac93.sh 据此逐件对账播种；manifest 缺席=整源弃=诚实冷编（fail-open）。
      - name: Export trust cache (mirror + manifest provenance, bootstrap future SKIP, macOS)
        if: success()
        shell: bash -e {0}
        run: |
          mkdir -p /Users/apple/vo_ci_cache_set
          rm -f /Users/apple/vo_ci_cache_set/*.vo /Users/apple/vo_ci_cache_set/Local/*.vo /Users/apple/vo_ci_cache_set/_manifest.tsv 2>/dev/null || true
          find ConstructiveWorld_Live -maxdepth 1 -name "*.vo" -exec cp {} /Users/apple/vo_ci_cache_set/ \;
          : > /Users/apple/vo_ci_cache_set/_manifest.tsv
          for v in ConstructiveWorld_Live/*.v; do
            m="$(basename "$v" .v)"
            [ -f "ConstructiveWorld_Live/$m.vo" ] || continue
            printf '%s\t%s\t%s\n' "$m" "$(/sbin/md5 -q "$v")" "$(/sbin/md5 -q "ConstructiveWorld_Live/$m.vo")" >> /Users/apple/vo_ci_cache_set/_manifest.tsv
          done
          echo "exported $(ls /Users/apple/vo_ci_cache_set/*.vo 2>/dev/null | wc -l) .vo + _manifest.tsv ($(wc -l < /Users/apple/vo_ci_cache_set/_manifest.tsv | tr -d ' ') rows) to mac trust cache"

      - name: Upload vo trust cache (cross-machine sync, macOS)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: vo-trust-cache-set-macos
          path: |
            ConstructiveWorld_Live/*.vo
            /Users/apple/vo_ci_cache_set/_manifest.tsv

      - name: gate2 axioms sentinel (block-state-machine, fail-loud)
        if: always()
        shell: bash -e {0}
        run: |
          if [ ! -f ConstructiveWorld_Live/_chk_all.log ]; then
            echo "GATE-BANNER-ABSENT: ConstructiveWorld_Live/_chk_all.log 不在盘——coqchk 未产出日志（上游 gate4/build 夭折连带，红因看上游步），非 COQLIB 代际失守"
            exit 1
          fi
          # 【20261102 换基】mac banner 钉随 Windows 同波预置 9.3.0：案B 暂闸期本步不跑；案A 解闸（mac_rocq 换 9.3）即生效。
          grep -q "Welcome to Chicken 9.3.0" ConstructiveWorld_Live/_chk_all.log \
            || { echo "GATE-BANNER-FAIL: coqchk 代际非 9.3（mac 工具链未换 9.3 或 COQLIB 钉代失守，log 不可作公理判据）"; exit 1; }
          python3 scripts/gates/gate2_axioms_parser.py \
            ConstructiveWorld_Live/_chk_all.log --json gate2_verdict.json

      - name: Upload coqchk logs (macOS)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coqchk-logs-macos
          path: |
            ConstructiveWorld_Live/_chk_all.log
            ConstructiveWorld_Live/_*.build.log
            gate1_ci.json
            gate2_verdict.json
            gate4_report.json
            gate5_vodep_report.json
