          path: |
            ConstructiveWorld_Live/_chk_*.log
            ConstructiveWorld_Live/_*.build.log
            gate1_ci.json
            gate2_verdict.json
            gate4_report.json
            gate5_vodep_report.json
            gate6_report.json
